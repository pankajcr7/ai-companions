<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Agent Company</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 70% 0%, #10201c 0%, #08110f 60%);
        color: #eef4f0;
        font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(560px, calc(100% - 32px));
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 24px;
        color: #9db3aa;
      }
      ul {
        list-style: none;
        margin: 0 0 24px;
        padding: 0;
        border: 1px solid rgb(238 244 240 / 0.1);
        border-radius: 14px;
      }
      li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
      }
      li + li {
        border-top: 1px solid rgb(238 244 240 / 0.1);
      }
      li span {
        flex: 1;
        min-width: 0;
      }
      li small {
        display: block;
        color: #9db3aa;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
        background: rgb(238 244 240 / 0.08);
        color: #eef4f0;
      }
      button:hover {
        background: rgb(238 244 240 / 0.14);
      }
      button.primary {
        background: #a6ff00;
        color: #08110f;
        padding: 12px 20px;
      }
      button:focus-visible {
        outline: 2px solid #a6ff00;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p id="lead">Agent Company needs the internet for your team. Try again once you're connected.</p>
      <ul id="links" hidden></ul>
      <button class="primary" id="retry" type="button">Try again</button>
    </main>
    <script>
      const desk = window.agentDesktop;
      const retry = () => desk && desk.retry();
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", retry);
      if (desk) {
        desk.links().then((links) => {
          if (!links.length) return;
          document.getElementById("lead").textContent =
            "Your synced folders are still on this computer. Changes you make there are sent once you're back online.";
          const list = document.getElementById("links");
          for (const l of links) {
            const li = document.createElement("li");
            const span = document.createElement("span");
            span.textContent = l.projectName;
            const small = document.createElement("small");
            small.textContent = l.folder;
            span.append(small);
            const open = document.createElement("button");
            open.type = "button";
            open.textContent = "Open folder";
            open.addEventListener("click", () => desk.openFolder(l.projectId));
            li.append(span, open);
            list.append(li);
          }
          list.hidden = false;
        });
      }
    </script>
  </body>
</html>

# Builds the desktop app's installers when a desktop version tag is pushed (git tag desktop-v0.1.0 && git push origin desktop-v0.1.0)
# and attaches them to a GitHub Release. The tag's number must match "version" in desktop/package.json.
name: Desktop app

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  # One release for the tag, made before the builds: each build then adds its installers to it, instead of the two
  # racing to create a release each (which split 0.3.1 into two).
  release:
    runs-on: ubuntu-latest
    steps:
      - run: >-
          gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1 ||
          gh release create "$TAG" --repo "$REPO" --title "${TAG#desktop-v}"
          --notes "Agent Company for Mac (.dmg: arm64 for Apple Silicon, x64 for Intel) and Windows (Setup .exe). How to install: desktop/README.md."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    needs: release
    strategy:
      # Each system's installer is built and published on its own: one failing doesn't cancel the other.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificate yet: don't look for one.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

# Render's free plan puts the server to sleep after 15 minutes without visitors, and the first sign-in then
# waits 30-60 seconds for it to wake. A tiny request every few minutes keeps it awake (owner-approved).
# Free for public repositories. GitHub may delay scheduled runs at busy times, and pauses them after
# 60 days without any commits; "Run workflow" on the Actions tab starts it again.
name: Keep the server awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the server
        run: curl --fail --silent --show-error --max-time 120 --output /dev/null --write-out "%{http_code} in %{time_total}s\n" https://ai-companions-five.vercel.app/api/auth-config
